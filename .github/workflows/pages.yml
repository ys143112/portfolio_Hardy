name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static files
        run: |
          node --check app.js
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
      - name: Verify public page
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --silent --show-error --fail --location --max-time 15 "${SITE_URL%/}/?v=${GITHUB_SHA}" -o "$RUNNER_TEMP/served.html" &&
               cmp -s _site/index.html "$RUNNER_TEMP/served.html"; then
              echo "Verified public HTML at $SITE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Public page did not match the deployed commit." >&2
          exit 1
